# Development CI.
#
# TRIGGERS: push to master (the release gate — master is what becomes a
# release) and manual dispatch on any branch. Deliberately NOT on push to
# development: the local dev loop already verifies fmt/clippy/tests/bench on
# Windows x86-64 every commit, so per-commit CI there would mostly re-check
# what is already known. Use the manual button before merging.
#
# Both triggers run the IDENTICAL job set. That is the point: a manual run is
# only useful as a pre-merge check if it is a faithful preview of the master
# gate. A subset would hand out false confidence.
#
# The toolchain is NOT specified here — rustup reads rust-toolchain.toml and
# installs the pinned compiler. CI therefore builds with the exact same
# rustc the developer does, which is the whole point of the pin.
name: CI

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# A newer run supersedes an in-flight one on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Show pinned toolchain
        run: |
          rustup show active-toolchain
          rustc -vV

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      # The lint wall (deny on unsafe_op_in_unsafe_fn, the three cast
      # lints, and eight more) only binds where it is actually run. This is what
      # makes it structural rather than a local habit.
      # Run per feature set on purpose: `cfg(feature = ...)` code is linted
      # only in a configuration that enables it, and not-enabled paths only in
      # one that does not.
      - name: cargo clippy (default features)
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo clippy (--features tune)
        run: cargo clippy --all-targets --features tune -- -D warnings

      - name: cargo clippy (--features diag)
        run: cargo clippy --all-targets --features diag -- -D warnings

      - name: cargo clippy (--features texel)
        run: cargo clippy --all-targets --features texel -- -D warnings

      # `b2core` is a default feature since B.2.4b, so every step above lints
      # the accepted selectivity core. These two cover the superseded B.1
      # search, which stays compilable until B.8 deletes it.
      - name: cargo clippy (--no-default-features, the legacy search)
        run: cargo clippy --all-targets --no-default-features -- -D warnings

      - name: cargo clippy (--features diag,tune)
        run: cargo clippy --all-targets --features diag,tune -- -D warnings

      # The proof-search candidate lives behind `b3proof`, so its blocks are
      # linted only when the feature is on; with diag and tune its counters
      # and `ProofParams` UCI plumbing compile too.
      - name: cargo clippy (--features b3proof)
        run: cargo clippy --all-targets --features b3proof -- -D warnings

      - name: cargo clippy (--features b3proof,diag,tune)
        run: cargo clippy --all-targets --features b3proof,diag,tune -- -D warnings

      - name: cargo clippy (workspace — covers xtask)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo clippy (texel tuner, its own workspace)
        run: cargo clippy --manifest-path tools/texel-tuner/Cargo.toml --all-targets -- -D warnings

  test:
    name: test ${{ matrix.os }} / ${{ matrix.profile }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is arm64 — the only shipped platform that previously had
        # NO coverage at all, and the one that exercises the AArch64 codegen
        # path the three arm64 assets are built from. windows-11-arm and
        # ubuntu-24.04-arm are covered by bench-fingerprint below: that job
        # proves every shipped platform agrees on the node count, which is the
        # cross-platform invariant that matters, and running the whole suite on
        # three more ARM runners would be largely redundant codegen coverage.
        os: [ubuntu-latest, windows-latest, macos-latest]
        profile: [debug, release]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Show pinned toolchain
        shell: bash
        run: |
          rustup show active-toolchain
          rustc -vV

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.profile }}

      # The debug run is not redundant with release: every debug_assert! in
      # infra's checked conversions, cont_index and piece_to_index compiles out
      # of release entirely, so the debug suite gets a real job.
      - name: cargo test — engine, default features (${{ matrix.profile }})
        shell: bash
        run: |
          if [ "${{ matrix.profile }}" = "release" ]; then
            cargo test -p rarog --release
          else
            cargo test -p rarog
          fi

      - name: cargo test — engine, legacy search (${{ matrix.profile }})
        shell: bash
        run: |
          if [ "${{ matrix.profile }}" = "release" ]; then
            cargo test -p rarog --release --no-default-features
          else
            cargo test -p rarog --no-default-features
          fi

      - name: cargo test — engine, b3proof candidate (${{ matrix.profile }})
        shell: bash
        run: |
          if [ "${{ matrix.profile }}" = "release" ]; then
            cargo test -p rarog --release --features b3proof
          else
            cargo test -p rarog --features b3proof
          fi

      - name: cargo test — tooling crates
        shell: bash
        run: |
          cargo test -p xtask
          cargo test --manifest-path tools/texel-tuner/Cargo.toml

  bench-fingerprint:
    name: bench ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86-64
            isa_arch: base
            ext: ""
          - os: windows-latest
            label: windows-x86-64
            isa_arch: base
            ext: ".exe"
          - os: ubuntu-24.04-arm
            label: linux-arm64
            isa_arch: arm64
            ext: ""
          - os: windows-11-arm
            label: windows-arm64
            isa_arch: arm64
            ext: ".exe"
          - os: macos-latest
            label: macos-arm64
            isa_arch: arm64
            ext: ""
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Show pinned toolchain
        shell: bash
        run: |
          rustup show active-toolchain
          rustc -vV

      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      # Catch an ISA-contract break at PR time, not at release time.
      - name: Install llvm-tools
        run: rustup component add llvm-tools

      # `--default-cpu`: this binary came from a plain `cargo build --release`,
      # so its permitted instruction set is the TARGET's default `target-cpu`,
      # not the tier baseline `cargo xtask build` would have used. On
      # aarch64-apple-darwin those differ sharply - the default enables aes,
      # sha2 and dotprod - so without this the macOS cell would forbid
      # instructions the binary is entitled to emit.
      - name: Verify the baseline ISA contract
        shell: bash
        run: >
          cargo xtask verify-isa --arch ${{ matrix.isa_arch }} --default-cpu
          --exe "target/release/rarog${{ matrix.ext }}"

      # NOTE: no expected value is hardcoded anywhere. The invariant checked in
      # the next job is that all platforms AGREE, not that they produce some
      # frozen number — bench output legitimately changes on every behavioural
      # commit, and a hardcoded constant would need editing constantly until
      # somebody just deleted the check. Cross-platform agreement, by contrast,
      # must hold forever regardless of what we change.
      # The legacy search must agree across platforms too; it builds into its
      # own target directory so the release binary above is untouched.
      - name: Build release, legacy search
        run: cargo build --release --no-default-features --target-dir target/legacy

      # The proof-search candidate must agree across platforms as well.
      - name: Build release, b3proof candidate
        run: cargo build --release --features b3proof --target-dir target/b3proof

      - name: Run bench and record node counts
        shell: bash
        run: |
          count() {
            echo bench | "$1" | tee "$2"
            nodes=$(sed -n 's/.*Nodes searched *: *\([0-9][0-9]*\).*/\1/p' "$2" | head -1)
            if [ -z "$nodes" ]; then
              echo "::error::could not parse a node count out of $2"
              exit 1
            fi
          }
          count "./target/release/rarog${{ matrix.ext }}" bench.log
          accepted=$nodes
          count "./target/legacy/release/rarog${{ matrix.ext }}" bench-legacy.log
          legacy=$nodes
          count "./target/b3proof/release/rarog${{ matrix.ext }}" bench-b3proof.log
          candidate=$nodes
          echo "${{ matrix.label }} $accepted $legacy $candidate" > "nodes-${{ matrix.label }}.txt"
          echo "$accepted nodes (legacy $legacy, b3proof $candidate) on ${{ matrix.label }}"

      - uses: actions/upload-artifact@v7
        with:
          name: nodes-${{ matrix.label }}
          path: nodes-${{ matrix.label }}.txt

  bench-agreement:
    name: cross-platform determinism
    runs-on: ubuntu-latest
    needs: bench-fingerprint
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: nodes-*
          merge-multiple: true

      # The single check local development CANNOT perform. Node count is
      # decided by deterministic integer search logic, so every platform and
      # architecture must reach the identical number. A disagreement is a real
      # bug — an unsound unsafe block (17 remain), a data race in lazy SMP, or
      # float non-determinism — never a benign platform quirk.
      - name: All platforms must report the same node counts
        run: |
          cat nodes-*.txt
          for column in 2 3 4; do
            counts=$(awk -v c=$column '{print $c}' nodes-*.txt | sort -u | wc -l)
            if [ "$counts" -ne 1 ]; then
              echo "::error::platforms disagree on bench node count (column $column) — see the table above"
              exit 1
            fi
          done
          echo "all platforms agree: $(awk '{print $2, "legacy", $3, "b3proof", $4}' nodes-*.txt | sort -u)"

  features:
    name: feature builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Show pinned toolchain
        run: |
          rustup show active-toolchain
          rustc -vV

      - uses: Swatinem/rust-cache@v2

      # None of these are in the default build, so all three can rot unnoticed
      # — and `tune` is what the SPSA runs on, so its rotting would be found at
      # the worst possible moment.
      - name: Build --features tune
        run: cargo build --release --features tune

      - name: Build --features diag
        run: cargo build --release --features diag

      - name: Build --features tune,ablate
        run: cargo build --release --features tune,ablate

      # `ablate` was the fourth declared feature and the only one CI never
      # built, so it could rot unnoticed exactly like the other three would
      # have. It is the paired-ablation instrument; it is needed the moment an
      # ablation is wanted, which is never a convenient moment to discover a
      # build error.
      - name: Build --features ablate
        run: cargo build --release --features ablate

      # The set B.3.2's bit sweep and B.3.3's tune run on.
      - name: Build --features b3proof,tune,ablate
        run: cargo build --release --features b3proof,tune,ablate

      # Single features are not enough. Which items arrive under a
      # given `cfg` differs per COMBINATION, so a module can compile under
      # `diag` and under `tune` and fail under both. This enumerates all 64
      # subsets of the six declared features with
      # `cargo check --all-targets --no-default-features`, which catches the
      # same compilation errors far more cheaply than 32 builds. Every subset
      # starts from a clean slate, so `b2core` is an axis like any other and
      # the subsets without it cover the legacy search until B.8 deletes it.
      #
      # Deliberately NOT `--all-features`: that is not a shipped configuration.
      # It enables `texel`, which bypasses the eval and pawn caches, and a
      # binary left in target/release by an --all-features test run must never
      # be measured (AGENTS.md).
      - name: Feature matrix (all 64 subsets compile)
        run: python tools/diag/feature_matrix.py

      - name: Build the texel tuner (uses --features texel)
        run: cargo build --release --manifest-path tools/texel-tuner/Cargo.toml

      - name: Build xtask and benches
        run: cargo build --release -p xtask --all-targets
