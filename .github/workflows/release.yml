name: Release
run-name: ${{ github.ref_type == 'tag' && github.ref_name || format('release candidate {0}', github.sha) }}

# A release is cut by pushing a `vX.Y.Z` tag on master; nothing else. A patch
# release that cannot wait for master (it already holds unreleased work) is
# tagged on a temporary branch of its line's first release, `vX.Y.0`, which is
# on master. The workflow validates first (the tag names Cargo.toml's version,
# the tagged commit is on master or such a patch, CHANGELOG.md has a dated
# section for it), builds the
# five PGO assets read-only (the universal x86-64 binary for Linux and
# Windows, which picks its tier at start-up, and the three arm64 builds),
# checks the x86-64 tier selection under Intel SDE, benches every one and asserts a single `bench 13`
# fingerprint across the matrix equal to the one GUIDE's checkpoint declares,
# and only then one job with write permission publishes the release with every
# asset and the notes taken from that CHANGELOG section. Nothing exists on
# GitHub until every cell has passed, so a failed run is repaired by deleting
# the tag, fixing master and tagging again.
#
# A pull request to master runs the same build, bench and fingerprint
# checks as a candidate, so a green PR means a green release build; a manual
# dispatch does the same on a chosen ref (the rehearsal). Either keeps the
# bundle as a workflow artifact and creates no tag and no release.
#
# Only `v<major>.<minor>.<patch>` tags trigger this, never the `arm/…` or
# `oracle/…` markers.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches: [master]
  workflow_dispatch:

# A newer commit on the same pull request supersedes its candidate build;
# tag and dispatch runs are never cancelled.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Validate the tag, the changelog and the declared fingerprint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      mode: ${{ steps.meta.outputs.mode }}
      version: ${{ steps.meta.outputs.version }}
      name: ${{ steps.meta.outputs.name }}
      expected_nodes: ${{ steps.meta.outputs.expected_nodes }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # No toolchain action: rustup reads rust-toolchain.toml and installs
      # the pinned compiler, the same one the developer builds with.
      - name: Show pinned toolchain
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-prepare

      - name: Validate
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            cargo xtask release-check "$GITHUB_REF_NAME" --notes release-notes.md
            mode=release
            version="${GITHUB_REF_NAME#v}"
          else
            mode=candidate
            version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
            if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              # A plain version declares this commit a release: it passes
              # every check the tag run makes except the two only a tag can
              # (its name, and the commit on master once merged; `--base
              # HEAD` waives the second), so a green PR is a releasable one.
              # A `-dev` version is not a release and skips this.
              cargo xtask release-check "v$version" --base HEAD --notes release-notes.md
            else
              echo "candidate build of $GITHUB_SHA at version $version; nothing will be published" > release-notes.md
            fi
          fi
          # GUIDE's checkpoint declares the fingerprint once, in its
          # Development head row; release-check (above, for a tag) and this
          # read share xtask's parser. Every asset must reproduce it. A
          # cross-platform mismatch is investigated, never waived.
          expected="$(cargo xtask declared-fingerprint)"
          test -n "$expected"
          # What `id name` and every file name carry: the version at a
          # release, `dev-<date>-<hash>` for a development build.
          name="$(cargo xtask version)"
          test -n "$name"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "expected_nodes=$expected" >> "$GITHUB_OUTPUT"
          echo "mode $mode, version $version, name $name, expected bench 13 nodes $expected"

      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  build:
    name: Build ${{ matrix.os_name }} ${{ matrix.arch }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every cell is a NATIVE runner (host triple == target), which PGO
          # requires: the instrumented binary runs its training bench locally.
          # An x64 cell builds the universal binary, every tier trained on
          # this runner; arm64 has no tiers. Linux stays on 24.04: the static
          # binary carries glibc, and 26.04's `libc.a` runs AVX2 code outside
          # its run-time dispatch, which the ISA check rejects.
          - { runner: ubuntu-24.04, os_name: linux, arch: x64, universal: true, target: x86_64-unknown-linux-gnu, ext: "" }
          - { runner: ubuntu-24.04-arm, os_name: linux, arch: arm64, universal: false, target: aarch64-unknown-linux-gnu, ext: "" }
          - { runner: windows-2025, os_name: windows, arch: x64, universal: true, target: x86_64-pc-windows-msvc, ext: ".exe" }
          # PGO here depends on a WORKAROUND, not on stock toolchain support:
          # linked with MSVC link.exe the instrumented binary emits .profraw
          # files with an empty symbol-name table and llvm-profdata refuses
          # them. xtask forces LLD for this target (`linker_flags` in
          # xtask/src/main.rs, rust-lang/rust#156675) — when that lands, drop
          # the override and re-test.
          - { runner: windows-11-arm, os_name: windows, arch: arm64, universal: false, target: aarch64-pc-windows-msvc, ext: ".exe" }
          - { runner: macos-26, os_name: macos, arch: arm64, universal: false, target: aarch64-apple-darwin, ext: "" }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Show pinned toolchain
        shell: bash
        run: |
          rustup show active-toolchain
          rustc -vV

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      # `verify-isa` disassembles the finished asset and PGO merges profiles;
      # both need llvm-tools.
      - name: Install llvm-tools
        run: rustup component add llvm-tools

      # xtask names the file (`rarog-<name>-<os>-<arch>`), checks the built
      # engine reports that name and, for the universal binary, that every
      # tier this runner runs, forced, benches one fingerprint.
      # macOS 11.0 is the first release for Apple silicon and rustc's default
      # for this target; set here so a runner's environment cannot move it.
      # The `cc` crate builds Fathom for the same target.
      - name: Build the PGO asset
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.os_name == 'macos' && '11.0' || '' }}
        run: >
          cargo xtask build --target ${{ matrix.target }}
          ${{ matrix.universal && '--universal' || '' }}

      - name: Take the asset
        id: asset
        shell: bash
        run: |
          set -euo pipefail
          name="rarog-${{ needs.prepare.outputs.name }}-${{ matrix.os_name }}-${{ matrix.arch }}${{ matrix.ext }}"
          built="target/dist/$name"
          test -f "$built" || { echo "::error::expected artifact not found: $built"; ls -la target/dist || true; exit 1; }
          mkdir -p asset
          mv "$built" "asset/$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      # The ISA contract, checked on the asset about to be shipped: no
      # instruction the tier's target-cpu does not enable, every class the
      # tier exists to emit. Node agreement cannot see this class of defect.
      - name: Verify the ISA contract
        shell: bash
        run: >
          cargo xtask verify-isa --target ${{ matrix.target }}
          ${{ matrix.universal && '--universal' || '' }}
          --exe "asset/${{ steps.asset.outputs.name }}"

      # The UCI handshake, the name and the fingerprint. The node count must
      # equal the one GUIDE declares for the tagged source; a stale or wrong
      # source cannot ship with a plausible count.
      - name: Smoke-test and fingerprint the asset
        shell: bash
        run: |
          set -euo pipefail
          bin="asset/${{ steps.asset.outputs.name }}"
          chmod +x "$bin" 2>/dev/null || true
          out="$({ echo uci; echo quit; } | "$bin")"
          echo "$out" | grep -q '^uciok' || { echo "::error::no uciok in the UCI handshake"; exit 1; }
          echo "$out" | grep -q "^id name Rarog ${{ needs.prepare.outputs.name }}\$" \
            || { echo "::error::id name does not read 'Rarog ${{ needs.prepare.outputs.name }}'"; echo "$out" | grep '^id name'; exit 1; }
          nodes="$("$bin" bench 13 | grep -i 'Nodes searched' | grep -oE '[0-9]+' | head -1)"
          expected='${{ needs.prepare.outputs.expected_nodes }}'
          echo "bench 13: $nodes nodes (declared $expected)"
          test "$nodes" = "$expected" || { echo "::error::fingerprint $nodes differs from the declared $expected"; exit 1; }
          if [ '${{ matrix.universal }}' = true ]; then
            for tier in base sse42 avx2 pext; do
              forced="$(RAROG_ISA=$tier "$bin" bench 13)"
              echo "$forced" | grep -q "^Rarog .* ($tier)\$" || { echo "::error::the forced $tier tier does not say so"; echo "$forced" | head -2; exit 1; }
              n="$(echo "$forced" | grep -i 'Nodes searched' | grep -oE '[0-9]+' | head -1)"
              echo "forced $tier: $n"
              test "$n" = "$expected" || { echo "::error::the forced $tier tier benches $n, not $expected"; exit 1; }
            done
          fi
          # What the asset needs from the system, checked rather than assumed.
          # Windows and Linux link their C runtime in (xtask refuses a build
          # that does not); macOS cannot, and needs macOS 11.0.
          case '${{ matrix.os_name }}' in
            linux)
              if readelf -l "$bin" | grep -q INTERP; then
                echo "::error::the Linux asset is dynamically linked"; readelf -d "$bin" | grep NEEDED; exit 1
              fi
              echo "statically linked: no glibc needed"
              ;;
            macos)
              minos="$(vtool -show-build "$bin" | awk '$1 == "minos" {print $2}')"
              echo "minimum macOS: $minos"
              [ "$minos" = 11.0 ] || { echo "::error::the asset needs macOS $minos, not 11.0"; exit 1; }
              ;;
          esac
          echo "$nodes" > "asset/${{ steps.asset.outputs.name }}.nodes"

      - uses: actions/upload-artifact@v7
        with:
          name: asset-${{ matrix.os_name }}-${{ matrix.arch }}
          path: asset/*
          if-no-files-found: error

  # The universal binary's tier selection under Intel SDE: each emulated CPU
  # must start the tier the dispatcher's rule gives it and reproduce the
  # fingerprint there, and a forced tier it cannot run must be refused
  # (tools/diag/check_universal.py). The action is pinned by commit.
  select:
    name: Tier selection under SDE (${{ matrix.os_name }})
    needs: [prepare, build]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, os_name: linux, ext: "" }
          - { runner: windows-2025, os_name: windows, ext: ".exe" }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: asset-${{ matrix.os_name }}-x64
          path: asset

      - name: Download SDE
        uses: petarpetrovt/setup-sde@31aa4a8e85e109bef00f1d838613fcc6ec421271 # v5.0
        with:
          environmentVariableName: SDE_DIR
          sdeVersion: 9.58.0

      - name: Check the tier each CPU selects
        shell: bash
        run: |
          set -euo pipefail
          binary="asset/rarog-${{ needs.prepare.outputs.name }}-${{ matrix.os_name }}-x64${{ matrix.ext }}"
          chmod +x "$binary"
          python=$(command -v python3 || command -v python)
          "$python" tools/diag/check_universal.py --binary "$binary" --sde "$SDE_DIR" \
            --bench '${{ needs.prepare.outputs.expected_nodes }}'

  collect:
    name: Verify the complete matrix
    needs: [prepare, build, select]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: asset-*
          merge-multiple: true
          path: bundle

      - name: Five assets, one fingerprint
        shell: bash
        run: |
          set -euo pipefail
          cd bundle
          name='${{ needs.prepare.outputs.name }}'
          expected=(
            "rarog-${name}-linux-x64" "rarog-${name}-linux-arm64"
            "rarog-${name}-windows-x64.exe" "rarog-${name}-windows-arm64.exe"
            "rarog-${name}-macos-arm64"
          )
          for f in "${expected[@]}"; do test -f "$f" || { echo "::error::missing asset $f"; exit 1; }; done
          test "$(ls | grep -vc '\.nodes$')" -eq 5
          nodes="$(cat *.nodes | sort -u)"
          test "$(wc -l <<<"$nodes")" -eq 1 || { echo "::error::the assets disagree on bench 13: $nodes"; exit 1; }
          test "$nodes" = '${{ needs.prepare.outputs.expected_nodes }}'
          rm -f *.nodes
          sha256sum "${expected[@]}" | tee SHA256SUMS
          echo "five assets at bench 13 = $nodes"

      - uses: actions/upload-artifact@v7
        with:
          name: rarog-${{ needs.prepare.outputs.mode }}-${{ github.sha }}
          path: bundle/*
          if-no-files-found: error
          retention-days: ${{ needs.prepare.outputs.mode == 'candidate' && 30 || 90 }}

  publish:
    name: Publish the release
    # Release mode is only ever set for a tag; the event check keeps a
    # pull request or dispatch from reaching the write permission regardless.
    if: needs.prepare.outputs.mode == 'release' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [prepare, collect]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: The tagged commit is on master, or a patch on its line's first release
        run: |
          git fetch origin master --tags
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then exit 0; fi
          version="${GITHUB_REF_NAME#v}"
          line="v${version%.*}.0"
          test "${version##*.}" != 0
          git merge-base --is-ancestor "$line" "$GITHUB_SHA"
          git merge-base --is-ancestor "$line" origin/master

      - uses: actions/download-artifact@v8
        with:
          name: rarog-release-${{ github.sha }}
          path: bundle

      - uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: notes

      - name: Recheck the bundle
        run: cd bundle && sha256sum --check SHA256SUMS

      # SHA256SUMS is checked between jobs and not published: a checksum file
      # beside the assets it describes proves nothing an attacker who can
      # replace one cannot also replace. GitHub's per-asset digests are the
      # ones to compare against.
      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          name: Rarog ${{ needs.prepare.outputs.version }}
          body_path: notes/release-notes.md
          make_latest: true
          fail_on_unmatched_files: true
          files: bundle/rarog-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-ok:
    name: Release candidate passed
    # The one check to require. A job skipped because a job it needs failed
    # reports as skipped, which a required check reads as passing; this job
    # always runs, and fails unless every job it gathers succeeded.
    if: always()
    needs: [prepare, build, select, collect]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every gathered job succeeded
        shell: bash
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo "$RESULTS"
          [ "$FAILED" = "false" ] || { echo "::error::a gathered job did not succeed"; exit 1; }
