# Pinned toolchain — 9.1 reproducible-build gate.
#
# WHY PIN: a released binary must be rebuildable from its commit SHA, and —
# more sharply for our methodology — an unnoticed `rustup update` landing
# between a baseline build and its candidate silently folds compiler delta
# into a measured Elo/NPS result. At +-3 Elo resolution that is real
# contamination. Pinning makes every A/B pair compiler-identical by
# construction and turns "the compiler changed" into a dated, measured event.
#
# THIS DOES NOT FREEZE YOU. `rustup update` still updates the global
# toolchain and every other project on the machine; only rarog waits for a
# deliberate bump of the line below (rustup auto-downloads it on next build).
# Bump ritual: PROCESS.md "Toolchain and harness notes" — never bump between
# building an SPRT baseline and its candidate.
[toolchain]
channel = "1.98.1"
components = ["rustfmt", "clippy", "llvm-tools-preview"]
profile = "minimal"

# Deliberately NO `targets` list. This file is read by every machine that
# builds the repo, including the release workflow's Linux, macOS and ARM
# runners — listing a host-specific target here would make all of them
# download an std they never use. Cross-targets are added where they are
# actually needed (build.yml's `rustup target add`), not globally.
